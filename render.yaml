services:
  - type: web
    name: ai-persona-chat
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cp -r dist ../backend/static
    startCommand: bash backend/start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: persona-chat-db
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE
        sync: false
      - key: AI_MODEL
        value: gpt-4o

databases:
  - name: persona-chat-db
    plan: free
