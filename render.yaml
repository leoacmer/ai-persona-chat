services:
  - type: web
    name: ai-persona-chat
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cp -r dist ../backend/static
    startCommand: bash backend/start.sh
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE
        sync: false
      - key: AI_MODEL
        value: deepseek-chat
      - key: UVICORN_LOOP
        value: asyncio
