services:
  - type: web
    name: ai-persona-chat-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: persona-chat-db
          property: connectionString
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE
        sync: false
      - key: AI_MODEL
        value: gpt-4o

  - type: static
    name: ai-persona-chat
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://ai-persona-chat-api.onrender.com

databases:
  - name: persona-chat-db
    plan: free
